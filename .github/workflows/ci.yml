name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:

jobs:
  install:
    name: ci/install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

  lint-typecheck:
    name: ci/lint-typecheck
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx eslint app/ src/ --ext .ts,.tsx --max-warnings 0
      - run: npx tsc --noEmit

  commitlint:
    name: ci/commitlint
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - run: npm install

      - run: npx commitlint --from=origin/${{ github.base_ref }} --to=HEAD