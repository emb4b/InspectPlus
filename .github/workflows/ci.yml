name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:

jobs:
  install:
    name: ci/install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

  lint-typecheck:
    name: ci/lint-typecheck
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Lint
        run: npx eslint . --ext .ts,.tsx,.js,.jsx --max-warnings 0

  test:
    name: ci/test
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run tests
        run: npx jest --ci

  commitlint:
    name: ci/commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint commit messages in PR range
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  # Builds the Android APK on EAS and publishes it as a GitHub release once
  # lint/typecheck and tests are green — a job here rather than a separate
  # workflow_run-triggered workflow because GitHub only registers
  # workflow_run triggers from the default branch, which is still the bare
  # initial commit; this job runs from whichever branch was pushed.
  eas-build:
    name: ci/eas-build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    # The built-in token needs write access to create releases and upload
    # the APK; nothing else in this job writes to the repo.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine build profile and release tag
        id: meta
        run: |
          version="$(jq -r .expo.version app.json)"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            # A full release, tagged with the app's own version so the
            # stable .../releases/latest/download/inspectplus.apk link
            # resolves to it. Shipping the same version twice would silently
            # replace an APK inspectors may already have installed, so a
            # main build that doesn't bump app.json's version stops here.
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "::error::v$version is already released. Bump expo.version in app.json before pushing to main."
              exit 1
            fi
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # develop builds are pre-releases: one per merge, tagged with the
            # run number so they never collide and never become "latest".
            echo "profile=preview" >> "$GITHUB_OUTPUT"
            echo "tag=v$version-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build on EAS (Android)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build --platform android --profile ${{ steps.meta.outputs.profile }} --non-interactive --wait --json > build.json
          jq -r '.[0].artifacts.buildUrl' build.json > build-url.txt
          test -s build-url.txt && grep -q '^https://' build-url.txt || { echo "::error::EAS build produced no artifact URL"; cat build.json; exit 1; }

      - name: Download APK
        run: curl --fail --location --silent --show-error "$(cat build-url.txt)" -o inspectplus.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          flags=(--title "$TAG" --target "$GITHUB_SHA" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" inspectplus.apk "${flags[@]}"
