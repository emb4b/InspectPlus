name: EAS Build

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - develop
      - main

# The built-in token needs write access to create releases and upload the
# APK; nothing else in this job writes to the repo.
permissions:
  contents: write

jobs:
  eas-build:
    name: ci/eas-build
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine build profile and release tag
        id: meta
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="$(jq -r .expo.version app.json)"
          if [ "$HEAD_BRANCH" = "main" ]; then
            # A full release, tagged with the app's own version so the
            # stable .../releases/latest/download/inspectplus.apk link
            # resolves to it. Shipping the same version twice would silently
            # replace an APK inspectors may already have installed, so a
            # main build that doesn't bump app.json's version stops here.
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "::error::v$version is already released. Bump expo.version in app.json before pushing to main."
              exit 1
            fi
            echo "profile=production" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # develop builds are pre-releases: one per merge, tagged with the
            # run number so they never collide and never become "latest".
            echo "profile=preview" >> "$GITHUB_OUTPUT"
            echo "tag=v$version-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build on EAS (Android)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build --platform android --profile ${{ steps.meta.outputs.profile }} --non-interactive --wait --json > build.json
          jq -r '.[0].artifacts.buildUrl' build.json > build-url.txt
          test -s build-url.txt && grep -q '^https://' build-url.txt || { echo "::error::EAS build produced no artifact URL"; cat build.json; exit 1; }

      - name: Download APK
        run: curl --fail --location --silent --show-error "$(cat build-url.txt)" -o inspectplus.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          flags=(--title "$TAG" --target "$HEAD_SHA" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" inspectplus.apk "${flags[@]}"
